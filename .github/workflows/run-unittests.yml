# Runs the sosw unit test suite on every pull request: once per supported Python version
# (3.12 - 3.14), plus a separate coverage job that enforces the minimum line coverage
# threshold.

name: Tests

on:
  pull_request:
    branches:
      - '**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest boto3

    - name: Run unit tests
      run: python -m pytest sosw/test/suite_unit.py

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov boto3

    # Full line coverage is enforced since the tests & coverage PR of the 3.0.0 release.
    - name: Run unit tests with coverage
      run: python -m pytest sosw/test/suite_unit.py --cov=sosw --cov-report=term --cov-fail-under=100
